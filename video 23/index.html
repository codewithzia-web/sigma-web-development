<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css display properties</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            display: inline-block;
            margin: 20px;
            background-color: aqua;
            border: 2px solid red;
            padding: 20px;
            /* display: none; */
            /* visibility: hidden; */

        }
        span{
            background-color: red;
            color: yellow;
            border: 2px solid black;
            
        }

    </style>
    
</head>
<body>
    <div class="box">this is the box</div>
    <div class="box">this is also box</div>
    <span>this is the span</span>
</body>
</html>

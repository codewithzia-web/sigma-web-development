<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sigma project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Basic&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <style>
        /* :root{
            --color: lightgray;
            --sec-color: rgb(107, 226, 107);
            --bac--color: rgb(163, 163, 27);
            --pri-color: orange;
        } */
        :root{
            --color: lightgray;
            --sec-color: rgb(7, 191, 236);
            --bac--color: rgb(75, 27, 163);
            --pri-color: rgba(175, 238, 29, 0.842);
        }
        body{
            background-color: var(--sec-color);
        }
        * {
            margin: 0;
            padding: 0;
        }
       
        
        nav{
            position: sticky;

        }

        nav ul {
            background-color: var(--bac--color);
            padding: 20px;
            margin: 5px;
        }

        nav ul li {
            display: inline;
            list-style: none;
            width: 100vw;
            height: 20vh;
            border: 2px solid var(--sec-color);
            border-radius: 7px;
            font-size: 18px;
            font-weight: bolder;
            font-family: "Poppins", sans-serif;
            padding: 10px;
            margin: 5px;
            background-color: var(--pri-color);
            color: var(--color);
        }

        .boxes {
            width: 100%;
            height: 80vh;
            border: 2px solid var(--sec-color);
            border-radius: 6px;
            background-color: var(--bac--color);
            padding: 10px;
            box-sizing: border-box;
            
        }

        .boxes div {
            width: 40vw;
            height: 70vh;
            border: 2px solid var(--sec-color);
            border-radius: 6px;
            display: inline-block;
            margin: 25px 5px 10px 70px;
            padding: 10px;
            box-sizing: border-box;


        }

        .box1 {
            background-color: var(--bac--color);
            color:var(--color);
        }

        .box2 {
            background-color: var(--bac--color);
            color: var(--color);
        }

        .sigma {
            border: 2px solid var(--sec-color);
            border-radius: 6px;
            width: 98vw;
            height: 20vh;
            background-color: var(--bac--color);
            color: var(--color);
            padding: 20px;
            margin: 5px;
            box-sizing: border-box;
            font-size: 4em;
            text-align: center;
            font-family: "Poppins", sans-serif;
            text-transform: capitalize;
            




        }
        .button{
            border: 2px solid var(--sec-color);
            border-radius: 50px;
            position: fixed;
            background-color: var(--bac--color);
            width: 50px;
            height: 50px;
            color: var(--color);
            padding: 10px;
            
        }
        .button:hover{
            border: 2px solid #7772D4;
            cursor: pointer;
            box-shadow: 5px 5px 5px var(--sec-color);
            text-transform: capitalize;
        }
        footer{
            background-color: var(--bac--color);
            color: var(--color);
            border: 2px solid var(--sec-color);
            border-radius: 6px;
            text-align: center;
            text-transform: capitalize;
            padding: 20px;
            margin: 5px;
            width: 98vw;
            height: 30vh;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            text-transform: capitalize;
            font-size: 3em;
        }
        
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>home</li>
                <li>about</li>
                <li>content</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="boxes">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="sigma">wellcome to sigma web develpment course 
            <button class="button">click</button>
        </div>

    </main>
    <footer>
        copyright &copy;&nbsp;&nbsp;codewithzia-web
    </footer>
</body>

</html>

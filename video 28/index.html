<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position propertise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 15vh;
            width: 50%;
            border: 2px solid black;
            margin: 5px;
            padding: 10px;
        }

        .box1 {
            background-color: rebeccapurple;
            position: absolute;
            top: 0px;
            width: 80%;
            /* position: absolute;
            top: 0px;
            left: 0px; */
        }

        .box2 {
            background-color: rgb(214, 143, 49);
            /* position: relative;
            top: 50px;
            left: 50px; */
        }

        .box3 {
            background-color: rgb(34, 216, 207);
        }

        .box4 {
            background-color: rgb(43, 245, 60);
            /* position: fixed;
            left: 25%;
            bottom: 0px; */
        }
        .parent{
            margin: 20px;
            padding: 20px;
            border: 3px solid red;
            height: 80vh;
            /* position: absolute; */
            /* transform: translate(0); */
            /* filter: invert(0); */
            perspective: 0;
        }
    </style>
</head>

<body>
    <div class="parent">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#html</title>
    <style>
        body{
            display: flex;
            justify-content: center;
        }
        .card{
            
            width: 20%;
            height: 65vh;
            border: 2px solid black;
            border-radius: 6px;
            background-color: lightgray;
        }
        img{
            width: 300px;
            height: 25vh;
            padding: 8px;
        }
        div li{
            display: inline-block;
            list-style: none;
            padding: 3px;
            margin-left: 50px;
            /* gap: 20px; */

            border: 1px solid darkgray;
            border-radius: 6px;

        }
        div h2{
            text-align: center;
            font-size: 18px;
            text-transform: capitalize;

        }
        div p{
            text-align: center;
            padding: 1px;
            margin-top: 10px;
        }
        div input{
            margin-left: 40%;
            text-align: center;
            margin-top: 30px;
        }
        input:hover{
            background-color: darkorange;
            cursor: pointer;
            text-transform: uppercase;
            
        }

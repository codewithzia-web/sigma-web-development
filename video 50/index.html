<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter</title>
    <style>
        body{
            display: flex;
        }
        .img1 img{
            filter: blur(1px);
        }
        .img2  img{
            filter: contrast(2);
        }

        .img3 img{filter:brightness(100px);}
    </style>
</head>
<body>
    <div class="img1"><img src="/ZS love.webp" alt=""></div>
    <div class="img2"><img src="/ZS love.webp" alt=""></div>
    <div class="img3"><img src="/ZS love.webp" alt=""></div>
</body>
</html>

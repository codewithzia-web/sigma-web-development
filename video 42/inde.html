<!DOCTYPE html>
<html lang="en">
<head>

    <title>transfoam</title>
    <style>
        .container{
            height: 80vh;
            width: 80vw;
            background-color: bisque;
            border: 2px solid black;

            padding: 20px;
            transform: rotatex(100deg));
            transform-origin: 30% 0%;
        }
    </style>
</head>

        <div class="box">
            box
        </div>
    </div>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css animation</title>
    <style>
        .container{
            width: 80vw;
            height: 80vh;
            background-color: lightyellow;
            color: brown;
            border: 2px solid black;
        }
        .box{
            width: 10vw;
            height: 10vh;
            background-color: green;
            border: 2px solid blue;
            /* animation-name: apnazia;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: ;
            animation-direction: ;
            animation-play-state: running; */
            animation: apnazia 3s ease-in-out 1s 2,
                       zia 3s ease-in 1s 3 ;
            
        }
        @keyframes apnazia {
            from{

            }
            to{
                transform: translateX(150%);
                background-color: blueviolet;
            }
        }
        @keyframes zia {
            0%{transform: rotateX(100deg);}
            20%{transform: rotateX(120deg);}
            40%{transform: rotateX(140deg);}
            60%{transform: rotateX(160deg);}
            80%{transform: rotateX(180deg);}
            100%{transform: rotateX(200deg);}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box </div>
    </div>
</body>
</html>

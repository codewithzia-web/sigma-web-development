<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body>
    <script>
        let first, second, third;
        let rand = Math.random();
        if (rand <0.33) {
            first = "rock";
            
        } else if (rand < 0.66 && rand >= 0.33) {
            first = "paper";
            
        } else {
            first = "scissors";
            
        }
        let rand2 = Math.random();
        if (rand2 <0.33) {
            second = "rock";
            
        } else if (rand2 < 0.66 && rand2 >= 0.33) {
            second = "paper";
            
        } else {
            second = "scissors";
            
        }
        let rand3 = Math.random();
        if (rand3 <0.33) {
            third = "rock";
            
        } else if (rand3 < 0.66 && rand3 >= 0.33) {
            third = "paper";
            
        } else {
            third = "scissors";
            
        }   
        console.log(`${first} ${second} ${third}`);
    </script>
</body>

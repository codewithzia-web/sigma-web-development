<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media Quaries</title>
    <style>
        body{
            background-color: aqua;
        }
        h1{
            font-size: 25px;
            color: rgb(223, 235, 223);
            background-color: red;
            text-align: center;
            text-decoration: underline;
            font-weight: bold;
            text-transform: capitalize;
            text-shadow: 4px 2px 5px rgb(36, 59, 57);
            gap: 10;
            border: 2px solid black;
            border-radius: 6px;
            padding: 20px;
            margin: 5px;
            box-sizing: border-box;
            box-shadow: 5px 6px 5px red;
            
        }
        p{
            width: 50vw;
            height: 50vh;
            border: 2px solid black;
            padding: 5px;
            margin: 10px;
            background-color: yellowgreen;
            color: lightgray;
        }
        @media screen and (max-width: 455px){
            body{
                background-color: red;

            }
            h1{
                font-size: 2em;
            }
            p{
                height: 80vh;
            }

        }
                    
    </style>
</head>
<body>
    <h1>this is media Quaries</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Impedit delectus omnis cum, laboriosam quidem quo harum deleniti consequatur veniam! Libero incidunt sunt quasi vel nostrum sint facilis aperiam consequatur veritatis.</p>
</body>
</html>
